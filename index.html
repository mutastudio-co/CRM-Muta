<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muta — Control interno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{
    --turquesa:#2BBAD9; --arena:#BB9D82; --negro:#070A0F; --blanco:#fff; --bg:#f5f6f8;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--negro);}
  a{color:inherit;}
  .hidden{display:none;}
  nav{background:var(--negro);color:#fff;position:sticky;top:0;z-index:20;}
  .nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;flex-wrap:wrap;gap:8px;}
  .nav-links{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .nav-link{padding:6px 14px;border-radius:999px;font-size:14px;font-weight:600;color:rgba(255,255,255,.8);text-decoration:none;cursor:pointer;}
  .nav-link.active{background:var(--turquesa);color:var(--negro);}
  .nav-btn-white{background:#fff;color:var(--negro);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;cursor:pointer;border:none;text-decoration:none;}
  .nav-logout{color:rgba(255,255,255,.6);background:none;border:none;cursor:pointer;font-size:14px;}
  main{max-width:1100px;margin:0 auto;padding:24px 16px;}
  h1.page-title{font-family:'Sora',sans-serif;font-weight:800;font-size:26px;margin:0 0 20px;}
  .card{background:#fff;border-radius:18px;box-shadow:0 1px 3px rgba(7,10,15,.06),0 1px 2px rgba(7,10,15,.04);border:1px solid rgba(7,10,15,.06);padding:18px;margin-bottom:18px;}
  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
  .grid-3{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
  .grid-4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .stat-label{font-size:12px;color:rgba(7,10,15,.5);margin:0;}
  .stat-value{font-family:'Sora',sans-serif;font-weight:800;font-size:20px;margin:4px 0 0;}
  .btn{display:inline-block;border:none;border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;}
  .btn-primary{background:var(--turquesa);color:var(--negro);}
  .btn-dark{background:var(--negro);color:#fff;}
  .btn:hover{opacity:.85;}
  .btn-sm{padding:6px 12px;font-size:13px;border-radius:10px;}
  input,select,textarea{font-family:inherit;font-size:14px;border:1px solid rgba(7,10,15,.15);border-radius:12px;padding:8px 12px;background:#fff;color:var(--negro);}
  label.field-label{font-size:12px;color:rgba(7,10,15,.6);display:block;margin-bottom:4px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:10px 12px;}
  thead{background:rgba(7,10,15,.04);color:rgba(7,10,15,.6);}
  tbody tr{border-top:1px solid rgba(7,10,15,.06);}
  .badge{border-radius:999px;font-size:12px;font-weight:600;padding:3px 10px;display:inline-block;}
  .badge-activo{background:rgba(43,186,217,.15);color:#0f7d95;}
  .badge-inactivo{background:rgba(220,38,38,.1);color:#b91c1c;}
  .badge-sin_pagos{background:rgba(156,163,175,.2);color:#4b5563;}
  .chart-toggle{display:flex;gap:4px;}
  .chart-toggle button{background:rgba(7,10,15,.05);color:rgba(7,10,15,.6);border:none;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;}
  .chart-toggle button.active{background:var(--negro);color:#fff;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(7,10,15,.5);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px;}
  .modal{background:#fff;border-radius:18px;padding:24px;max-width:420px;width:100%;}
  .chip{font-size:12px;background:rgba(43,186,217,.1);padding:4px 10px;border-radius:10px;margin:2px;display:inline-block;}
  .login-wrap{min-height:100vh;background:var(--negro);display:flex;align-items:center;justify-content:center;padding:16px;}
  .report-header{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--turquesa);padding-bottom:14px;margin-bottom:20px;}
  .report-tag{font-weight:700;color:var(--turquesa);font-size:14px;}
  .back-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:rgba(7,10,15,.06);color:var(--negro);text-decoration:none;font-size:18px;font-weight:700;flex-shrink:0;}
  .back-btn:hover{background:rgba(43,186,217,.25);}
  .eye-card{position:relative;}
  .eye-btn{position:absolute;top:10px;right:10px;background:none;border:none;cursor:pointer;padding:4px;line-height:0;color:rgba(7,10,15,.45);border-radius:8px;}
  .eye-btn:hover{color:var(--negro);background:rgba(7,10,15,.06);}
  @media print{ .no-print{display:none !important;} body{background:#fff;} }
</style>
</head>

// -------------------- 2. CONSTANTES --------------------
const SERVICE_LABELS = {
  contenido: "Contenido",
  foto_video: "Fotografía y Video",
  meta_ads: "Campañas en Meta",
  diseno_grafico: "Diseño Gráfico",
  otro: "Otro",
};
// "Presencia" se unificó con "Contenido": los pagos viejos con presencia se muestran como contenido.
const LEGACY_SERVICE_MAP = { presencia: "contenido" };
function normService(s) { return LEGACY_SERVICE_MAP[s] || s; }
// Archivos adjuntos en pagos
const ALLOWED_EXT = ["pdf", "doc", "docx", "xls", "xlsx", "csv", "txt", "rtf", "odt", "ods", "md", "json", "xml", "jpg", "jpeg", "png"];
const ATTACH_ACCEPT = ALLOWED_EXT.map((e) => "." + e).join(",");
const MAX_FILE_MB = 10;
const BUCKET = "payment-files";
const INACTIVE_AFTER_DAYS = 61; // 2 meses sin pagos -> inactivo
const PALETTE = ["#2BBAD9", "#BB9D82", "#070A0F", "#5DD3EA", "#8E7360", "#9CA3AF"];

// -------------------- 3. UTILIDADES DE MÉTRICAS --------------------
// Las fechas "YYYY-MM-DD" que vienen de la base se leen como fecha LOCAL.
// (new Date("2026-09-01") las toma como UTC y en Argentina retrocede al 31/08.)
function parseLocalDate(v) {
  if (v instanceof Date) return v;
  const m = String(v).match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/);
  if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3] || 1));
  return new Date(v);
}
function localMonthStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; }
function localDateStr() { const d = new Date(); return `${localMonthStr()}-${String(d.getDate()).padStart(2, "0")}`; }
function addMonthsKey(key, n) {
  const [y, m] = key.split("-").map(Number);
  const d = new Date(y, m - 1 + n, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}
function monthKey(dateLike) {
  const d = parseLocalDate(dateLike);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}
function computeClientStatus(payments) {
  if (!payments || payments.length === 0) return "sin_pagos";
  const last = payments.reduce((latest, p) => {
    const d = parseLocalDate(p.period_month);
    return d > latest ? d : latest;
  }, new Date(0));
  const diffDays = (Date.now() - last.getTime()) / (1000 * 60 * 60 * 24);
  return diffDays > INACTIVE_AFTER_DAYS ? "inactivo" : "activo";
}
function statusLabel(s) { return { activo: "Activo", inactivo: "Inactivo", sin_pagos: "Sin pagos" }[s] || s; }
function totalSpent(payments) { return (payments || []).reduce((s, p) => s + Number(p.amount || 0), 0); }
function monthsWorkingTogether(startDate) {
  const start = parseLocalDate(startDate), now = new Date();
  let months = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
  if (now.getDate() < start.getDate()) months -= 1;
  return Math.max(0, months);
}
function formatMonthsLabel(months) {
  if (months < 1) return "menos de 1 mes";
  const years = Math.floor(months / 12), rem = months % 12;
  const parts = [];
  if (years > 0) parts.push(`${years} año${years > 1 ? "s" : ""}`);
  if (rem > 0 || years === 0) parts.push(`${rem} mes${rem !== 1 ? "es" : ""}`);
  return parts.join(" y ");
}
function formatCurrency(n) {
  return new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 }).format(Number(n || 0));
}
function groupPaymentsByMonth(payments) {
  const map = {};
  for (const p of payments || []) { const k = monthKey(p.period_month); map[k] = (map[k] || 0) + Number(p.amount || 0); }
  return map;
}
function groupPaymentsByYear(payments) {
  const map = {};
  for (const p of payments || []) { const y = parseLocalDate(p.period_month).getFullYear(); map[y] = (map[y] || 0) + Number(p.amount || 0); }
  return map;
}
// Un pago puede tener varios servicios (p.services). Los pagos viejos usan p.service.
function paymentServices(p) {
  let list = Array.isArray(p.services) && p.services.length ? p.services : [p.service];
  list = list.filter(Boolean).map(normService);
  return [...new Set(list)];
}
function groupPaymentsByService(payments) {
  const map = {};
  for (const p of payments || []) {
    const svcs = paymentServices(p);
    const share = Number(p.amount || 0) / (svcs.length || 1); // el monto se reparte en partes iguales
    for (const sv of svcs) map[sv] = (map[sv] || 0) + share;
  }
  return map;
}
function lastNMonthKeys(n) {
  const out = [], now = new Date();
  for (let i = n - 1; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); out.push(monthKey(d)); }
  return out;
}
function monthKeyLabel(key) {
  const [y, m] = String(key).split("-").map(Number);
  const d = new Date(y, m - 1, 1);
  return d.toLocaleDateString("es-AR", { month: "short", year: "2-digit" });
}
function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// -------------------- 4. LECTURA Y ANÁLISIS DE INFORMES --------------------
const KEYWORD_PATTERNS = [
  ["alcance", /alcance[s]?/i],
  ["impresiones", /impresion(es)?/i],
  ["interacciones", /interaccion(es)?/i],
  ["clics", /clic(k)?s?/i],
  ["seguidores_nuevos", /seguidor(es)?\s*(nuevos)?/i],
  ["me_gusta", /me\s*gusta|likes?/i],
  ["comentarios", /comentario[s]?/i],
  ["compartidos", /compartid[oa]s?|shares?/i],
  ["guardados", /guardado[s]?|saves?/i],
  ["reproducciones", /reproduccion(es)?|views?/i],
  ["inversion", /inversi[oó]n|presupuesto|gasto/i],
  ["resultados", /resultados?/i],
  ["costo_por_resultado", /costo\s*por\s*resultado|cpr/i],
  ["cpc", /\bcpc\b|costo\s*por\s*clic/i],
  ["cpm", /\bcpm\b/i],
  ["ctr", /\bctr\b/i],
  ["roas", /\broas\b/i],
  ["mensajes", /mensaje[s]?/i],
  ["visitas_perfil", /visita[s]?\s*(al\s*)?perfil/i],
];
function toNumber(value) {
  if (typeof value === "number") return value;
  if (!value) return null;
  const cleaned = String(value).replace(/[^\d.,-]/g, "").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".");
  const n = parseFloat(cleaned);
  return Number.isFinite(n) ? n : null;
}
function normalizeKey(h) {
  return String(h).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
}
function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
function extractMetricsFromRows(rows) {
  if (!rows || rows.length === 0) return { metrics: {} };
  const headers = Object.keys(rows[0] || {});
  const sums = {}, counts = {};
  for (const row of rows) {
    for (const h of headers) {
      const n = toNumber(row[h]);
      if (n !== null) { sums[h] = (sums[h] || 0) + n; counts[h] = (counts[h] || 0) + 1; }
    }
  }
  const metrics = {};
  for (const h of Object.keys(sums)) {
    metrics[normalizeKey(h)] = { label: h, total: round2(sums[h]), promedio: round2(sums[h] / counts[h]), filas: counts[h] };
  }
  return { metrics };
}
function extractMetricsFromText(text) {
  const metrics = {};
  const lines = String(text || "").split(/\r?\n/);
  for (const line of lines) {
    const numberMatch = line.match(/-?\d[\d.,]*/);
    if (!numberMatch) continue;
    const n = toNumber(numberMatch[0]);
    if (n === null) continue;
    for (const [key, pattern] of KEYWORD_PATTERNS) {
      if (pattern.test(line)) {
        if (metrics[key]) { metrics[key].total += n; metrics[key].apariciones += 1; }
        else { metrics[key] = { label: key, total: n, apariciones: 1 }; }
        break;
      }
    }
  }
  return metrics;
}
function parseExcel(arrayBuffer) {
  const wb = XLSX.read(arrayBuffer, { type: "array" });
  let allRows = [];
  wb.SheetNames.forEach((name) => {
    const json = XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: null });
    allRows = allRows.concat(json);
  });
  return extractMetricsFromRows(allRows);
}
function parseCsv(text) {
  const wb = XLSX.read(text, { type: "string" });
  const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: null });
  return extractMetricsFromRows(json);
}
async function parseDocx(arrayBuffer) {
  const result = await mammoth.extractRawText({ arrayBuffer });
  return { metrics: extractMetricsFromText(result.value || "") };
}
function parseHtmlReport(htmlString) {
  const doc = new DOMParser().parseFromString(htmlString, "text/html");
  const tables = doc.querySelectorAll("table");
  if (tables.length > 0) {
    let allRows = [];
    tables.forEach((table) => {
      const trs = [...table.querySelectorAll("tr")];
      if (trs.length === 0) return;
      const headerCells = [...trs[0].querySelectorAll("th,td")].map((td) => td.textContent.trim());
      trs.slice(1).forEach((tr) => {
        const cells = [...tr.querySelectorAll("td,th")].map((td) => td.textContent.trim());
        if (cells.length === 0) return;
        const row = {};
        headerCells.forEach((h, i) => { row[h || ("col_" + i)] = cells[i] ?? null; });
        allRows.push(row);
      });
    });
    if (allRows.length > 0) return extractMetricsFromRows(allRows);
  }
  const text = doc.body ? doc.body.textContent : "";
  return { metrics: extractMetricsFromText(text) };
}
function parseTextReport(text) { return { metrics: extractMetricsFromText(text) }; }

function pct(a, b) { if (!b || b === 0) return null; return ((a - b) / Math.abs(b)) * 100; }
function compareMetrics(current, previous) {
  const keys = new Set([...Object.keys(current || {}), ...Object.keys(previous || {})]);
  const comparison = [];
  for (const key of keys) {
    const curVal = current?.[key]?.total ?? null;
    const prevVal = previous?.[key]?.total ?? null;
    const change = (curVal !== null && prevVal !== null) ? pct(curVal, prevVal) : null;
    comparison.push({ key, label: current?.[key]?.label || previous?.[key]?.label || key, current: curVal, previous: prevVal, changePct: change !== null ? Math.round(change * 10) / 10 : null });
  }
  return comparison.sort((a, b) => (b.current || 0) - (a.current || 0));
}
function buildLocalSummary(comparison, opts = {}) {
  const { clientName, periodLabel, baseLabel } = opts;
  const ref = baseLabel || "el período anterior";
  if (!comparison || comparison.length === 0) return "No se detectaron métricas numéricas en el archivo cargado.";
  const withChange = comparison.filter((c) => c.changePct !== null);
  const improved = withChange.filter((c) => c.changePct > 0).sort((a, b) => b.changePct - a.changePct);
  const worsened = withChange.filter((c) => c.changePct < 0).sort((a, b) => a.changePct - b.changePct);
  const lines = [];
  const who = clientName ? `de ${clientName}` : "generales";
  lines.push(`Resumen del rendimiento ${who}${periodLabel ? ` — ${periodLabel}` : ""}.`);
  if (improved.length > 0) { const top = improved[0]; lines.push(`El indicador que más mejoró fue "${top.label}", con un incremento del ${top.changePct}% en comparación con ${ref}.`); }
  if (worsened.length > 0) { const worst = worsened[0]; lines.push(`El indicador con mayor caída fue "${worst.label}", con una baja del ${Math.abs(worst.changePct)}% en comparación con ${ref}.`); }
  if (withChange.length === 0) { lines.push("Es el primer período con datos cargados, todavía no hay una comparación histórica."); }
  else {
    const promedio = withChange.reduce((s, c) => s + c.changePct, 0) / withChange.length;
    const tendencia = promedio > 3 ? "una tendencia positiva" : promedio < -3 ? "una tendencia negativa" : "una tendencia estable";
    lines.push(`En conjunto, los indicadores muestran ${tendencia} (variación promedio de ${Math.round(promedio * 10) / 10}%).`);
  }
  return lines.join(" ");
}

let chartInstances = {};
let chartDatasets = {};
function chartCardHtml(id, title, labels, values) {
  chartDatasets[id] = { labels, values };
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">

}
function drawChart(id, type, btn) {
  if (btn) {
    btn.parentElement.querySelectorAll("button").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
  }
  const ds = chartDatasets[id];
  const ctx = document.getElementById(id);
  if (!ds || !ctx) return;
  if (chartInstances[id]) chartInstances[id].destroy();
  chartInstances[id] = new Chart(ctx, {
    type,
    data: {
      labels: ds.labels,
      datasets: [{
        data: ds.values,
        backgroundColor: type === "pie" ? ds.labels.map((_, i) => PALETTE[i % PALETTE.length]) : "#2BBAD9",
        borderRadius: type === "bar" ? 6 : 0,
      }],
    },
    options: {
      plugins: { legend: { display: type === "pie" } },
      scales: type === "bar" ? { y: { beginAtZero: true } } : {},
    },
  });
}

async function viewClienteDetalle(id) {
  loadingShell("clientes");
  const [{ data: client }, { data: payments }, { data: reports }] = await Promise.all([
    sb.from("clients").select("*").eq("id", id).single(),
    sb.from("payments").select("*").eq("client_id", id).order("period_month", { ascending: false }),
    sb.from("reports").select("*").eq("client_id", id).order("period_month", { ascending: false }),
  ]);
  if (!client) { app.innerHTML = navHtml("clientes") + "<main><p>Cliente no encontrado.</p></main>"; return; }

function serviceChecksHtml(prefix, selected) {
  const sel = new Set((selected || []).map(normService));
  return Object.entries(SERVICE_LABELS).map(([v, l]) =>
    `<label style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid rgba(7,10,15,.15);border-radius:999px;font-size:13px;cursor:pointer;margin:0 6px 6px 0;background:#fff;"><input type="checkbox" name="${prefix}Service" value="${v}" ${sel.has(v) ? "checked" : ""}> ${l}</label>`).join("");
}
function getCheckedServices(prefix) { return [...document.querySelectorAll(`input[name="${prefix}Service"]:checked`)].map((i) => i.value); }
function fileIcon(name) {
  const e = String(name).split(".").pop().toLowerCase();
  if (["jpg", "jpeg", "png"].includes(e)) return "🖼️";
  if (e === "pdf") return "📕";
  if (["xls", "xlsx", "csv", "ods"].includes(e)) return "📊";
  if (["doc", "docx", "odt", "rtf"].includes(e)) return "📝";
  return "📄";
}
function safeFileName(name) { return String(name).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9._-]+/g, "_"); }
function getAtt(p) { return Array.isArray(p.attachments) ? p.attachments : []; }

async function uploadPaymentFiles(clientId, paymentId, fileList) {
  const ok = [], failed = [];
  let i = 0;
  for (const f of fileList) {
    const ext = f.name.split(".").pop().toLowerCase();
    if (!ALLOWED_EXT.includes(ext)) { failed.push(`${f.name}: formato no permitido`); continue; }
    if (f.size > MAX_FILE_MB * 1024 * 1024) { failed.push(`${f.name}: supera ${MAX_FILE_MB} MB`); continue; }
    const path = `${clientId}/${paymentId}/${Date.now()}-${i++}-${safeFileName(f.name)}`;
    const { error } = await sb.storage.from(BUCKET).upload(path, f, { contentType: f.type || undefined, upsert: false });
    if (error) { failed.push(`${f.name}: ${error.message}`); continue; }
    ok.push({ path, name: f.name, size: f.size, type: f.type || ext });
  }
  return { ok, failed };
}
async function openAttachment(paymentId, idx) {
  const p = window.__currentClient.payments.find((x) => String(x.id) === String(paymentId));
  const a = p && getAtt(p)[idx];
  if (!a) return;
  const w = window.open("", "_blank");
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(a.path, 300);
  if (error || !data) { if (w) w.close(); alert("No se pudo abrir el archivo: " + (error?.message || "")); return; }
  if (w) w.location.href = data.signedUrl; else window.location.href = data.signedUrl;
}

async function registerPayment(e) {
  e.preventDefault();
  const { client } = window.__currentClient;
  const msg = document.getElementById("payMsg");
  const amount = Number(document.getElementById("payAmount").value);
  const month = document.getElementById("payMonth").value;
  const services = getCheckedServices("pay");
  const detail = document.getElementById("payDetail").value.trim();
  const files = document.getElementById("payFiles").files;
  if (!services.length) { msg.textContent = "Elegí al menos un servicio."; return false; }
  const btn = document.getElementById("payBtn");
  btn.disabled = true; btn.textContent = "Guardando...";
  const { data, error } = await sb.from("payments").insert({
    client_id: client.id, amount, period_month: `${month}-01`,
    service: services[0], services, service_detail: detail || null, attachments: [],
  }).select().single();
  if (error) {
    msg.textContent = `No se pudo registrar el pago (${error.message}). Si es la primera vez con esta versión, ejecutá el SQL de migración en Supabase.`;
    btn.disabled = false; btn.textContent = "Registrar";
    return false;
  }
  let warn = "";
  if (files.length) {
    const up = await uploadPaymentFiles(client.id, data.id, files);
    if (up.ok.length) await sb.from("payments").update({ attachments: up.ok }).eq("id", data.id);
    if (up.failed.length) warn = "El pago se guardó, pero algunos archivos no se pudieron subir:\n" + up.failed.join("\n");
  }
  await viewClienteDetalle(client.id);
  if (warn) alert(warn);
  return false;
}

async function savePaymentEdit(e, id) {
  e.preventDefault();
  const { client, payments } = window.__currentClient;
  const p = payments.find((x) => String(x.id) === String(id));
  const errEl = document.getElementById("epError");
  const services = getCheckedServices("ep");
  if (!services.length) { errEl.textContent = "Elegí al menos un servicio."; return false; }
  const btn = document.getElementById("epBtn");
  btn.disabled = true; btn.textContent = "Guardando...";
  const removed = [...document.querySelectorAll(".epRemove:checked")].map((c) => c.value);
  const keep = getAtt(p).filter((a) => !removed.includes(a.path));
  const files = document.getElementById("epFiles").files;
  let up = { ok: [], failed: [] };
  if (files.length) up = await uploadPaymentFiles(client.id, p.id, files);
  const { data, error } = await sb.from("payments").update({
    amount: Number(document.getElementById("epAmount").value),
    period_month: `${document.getElementById("epMonth").value}-01`,
    service: services[0], services,
    service_detail: document.getElementById("epDetail").value.trim() || null,
    attachments: keep.concat(up.ok),
  }).eq("id", p.id).select();
  if (error || !data || data.length === 0) {
    errEl.textContent = error ? `No se pudo guardar (${error.message}).` : "No se pudo guardar: Supabase no dejó modificar el pago (revisá las políticas del SQL de migración).";
    btn.disabled = false; btn.textContent = "Guardar cambios";
    return false;
  }
  if (removed.length) await sb.storage.from(BUCKET).remove(removed);
  closePaymentEdit();
  await viewClienteDetalle(client.id);
  if (up.failed.length) alert("Algunos archivos no se pudieron subir:\n" + up.failed.join("\n"));
  return false;
}

  root.innerHTML = `

function toggleRepKind() {
  const kind = document.querySelector('input[name="repKind"]:checked').value;
  document.getElementById("repMonthWrap").classList.toggle("hidden", kind === "previo");
  document.getElementById("repMonth").required = kind !== "previo";
}
function closeUploadModal() { const r = document.getElementById("uploadModalRoot"); if (r) r.innerHTML = ""; }
async function handleUploadReport(e) {
  e.preventDefault();
  const { client, reports } = window.__currentClient;
  const fileInput = document.getElementById("repFile");
  const kind = document.querySelector('input[name="repKind"]:checked').value;
  const file = fileInput.files[0];
  const errEl = document.getElementById("repError");
  const btn = document.getElementById("repSubmitBtn");
  if (!file) return false;
  const oldBaseline = reports.find((r) => r.kind === "previo");
  if (kind === "previo" && oldBaseline && !confirm("Ya hay un informe previo cargado. ¿Reemplazarlo por este?")) return false;
  btn.disabled = true; btn.textContent = "Procesando...";
  try {
    const ext = file.name.split(".").pop().toLowerCase();
    let metrics = {};
    if (["xlsx", "xls"].includes(ext)) { metrics = parseExcel(await file.arrayBuffer()).metrics; }
    else if (ext === "csv") { metrics = parseCsv(await file.text()).metrics; }
    else if (ext === "docx") { metrics = (await parseDocx(await file.arrayBuffer())).metrics; }
    else if (["html", "htm"].includes(ext)) { metrics = parseHtmlReport(await file.text()).metrics; }
    else if (ext === "txt") { metrics = parseTextReport(await file.text()).metrics; }
    else { throw new Error(`Formato .${ext} no soportado.`); }

    let periodMonth, summary;
    if (kind === "previo") {
      // El informe previo se guarda en el mes anterior al inicio del trabajo conjunto.
      periodMonth = `${addMonthsKey(monthKey(client.start_date), -1)}-01`;
      summary = "Informe previo: punto de partida del cliente antes de iniciar con Muta. Sirve de base para medir la evolución.";
    } else {
      const month = document.getElementById("repMonth").value;
      periodMonth = `${month}-01`;
      const monthlyBefore = reports.filter((r) => r.kind !== "previo" && r.period_month < periodMonth)
        .sort((a, b) => (a.period_month < b.period_month ? 1 : -1))[0];
      const base = monthlyBefore || oldBaseline;
      const baseLabel = monthlyBefore ? `el mes anterior (${monthKeyLabel(monthlyBefore.period_month)})` : "antes de iniciar con Muta";
      const comparison = compareMetrics(metrics, base?.metrics || {});
      summary = buildLocalSummary(comparison, { clientName: client.name, periodLabel: monthKeyLabel(periodMonth), baseLabel });
    }
    const { error } = await sb.from("reports").insert({ client_id: client.id, period_month: periodMonth, source_name: file.name, source_type: ext, metrics, summary, kind });
    if (error) throw new Error(`${error.message}. Si es la primera vez con esta versión, ejecutá el SQL de migración en Supabase.`);
    if (kind === "previo" && oldBaseline) await sb.from("reports").delete().eq("id", oldBaseline.id);
    closeUploadModal();
    await viewClienteDetalle(client.id);
  } catch (err) {
    errEl.textContent = err.message || "Error al procesar el archivo.";
    btn.disabled = false; btn.textContent = "Cargar y analizar";
  }
  return false;
}

// -------------------- 14. VISTA: EXPORTAR INFORME --------------------
async function viewReporte(id) {
  loadingShell("");
  const [{ data: client }, { data: payments }, { data: reports }] = await Promise.all([
    sb.from("clients").select("*").eq("id", id).single(),
    sb.from("payments").select("*").eq("client_id", id).order("period_month"),
    sb.from("reports").select("*").eq("client_id", id).order("period_month", { ascending: false }),
  ]);
  const rs = reports || [];
  const monthly = rs.filter((r) => r.kind !== "previo");
  window.__reportData = { client, payments: payments || [], reports: rs, selectedMonth: monthly[0] ? monthly[0].period_month.slice(0, 7) : "", compareMode: "anterior", compareMonth: "" };
  renderReporte();
}
// Devuelve { report, label } con el informe contra el que se compara, según la opción elegida.
function resolveCompareBase() {
  const { reports, selectedMonth, compareMode, compareMonth } = window.__reportData;
  const baseline = reports.find((r) => r.kind === "previo");
  const monthly = reports.filter((r) => r.kind !== "previo" && r.period_month.slice(0, 7) !== selectedMonth)
    .sort((a, b) => (a.period_month < b.period_month ? -1 : 1));
  if (compareMode === "previo") return baseline ? { report: baseline, label: "antes de iniciar con Muta" } : null;
  if (compareMode === "inicio") { const f = monthly[0]; return f ? { report: f, label: `el primer mes de gestión (${monthKeyLabel(f.period_month)})` } : null; }
  if (compareMode === "anterior") {
    const cur = selectedMonth + "-01";
    const prev = monthly.filter((r) => r.period_month < cur).pop();
    return prev ? { report: prev, label: `el mes anterior (${monthKeyLabel(prev.period_month)})` } : null;
  }
  if (compareMode === "custom") {
    if (compareMonth === "previo" && baseline) return { report: baseline, label: "antes de iniciar con Muta" };
    const r = monthly.find((x) => x.period_month.slice(0, 7) === compareMonth) || (compareMonth ? null : monthly[0]);
    return r ? { report: r, label: monthKeyLabel(r.period_month) } : null;
  }
  return null;
}
function renderReporte() {
  const rd = window.__reportData;
  const { client, payments, reports, selectedMonth, compareMode, compareMonth } = rd;
  const baseline = reports.find((r) => r.kind === "previo");
  const monthly = reports.filter((r) => r.kind !== "previo");
  const currentReport = monthly.find((r) => r.period_month.slice(0, 7) === selectedMonth) || monthly[0];
  const byMonth = groupPaymentsByMonth(payments);
  const months = lastNMonthKeys(6);
  const total = totalSpent(payments);
  const monthOptions = monthly.length
    ? monthly.map((r) => `<option value="${r.period_month.slice(0, 7)}" ${r.period_month.slice(0, 7) === selectedMonth ? "selected" : ""}>${monthKeyLabel(r.period_month)}</option>`).join("")
    : '<option value="">Sin informes mensuales</option>';
  const modeOpts = [["anterior", "Mes anterior"], ["previo", "Antes de iniciar con Muta"], ["inicio", "Desde que iniciamos (primer mes)"], ["custom", "Otro mes a elegir…"]]
    .map(([v, l]) => `<option value="${v}" ${compareMode === v ? "selected" : ""}>${l}</option>`).join("");
  const customCandidates = [
    ...(baseline ? [{ v: "previo", l: "Antes de iniciar con Muta" }] : []),
    ...monthly.filter((r) => r.period_month.slice(0, 7) !== selectedMonth).map((r) => ({ v: r.period_month.slice(0, 7), l: monthKeyLabel(r.period_month) })),
  ];
  const customSelect = compareMode === "custom"
    ? `<select onchange="window.__reportData.compareMonth=this.value; renderReporte();" style="border-radius:8px;padding:6px 10px;">${customCandidates.map((c) => `<option value="${c.v}" ${c.v === compareMonth ? "selected" : ""}>${c.l}</option>`).join("") || '<option value="">Sin otros informes</option>'}</select>`
    : "";

  const cmp = currentReport ? resolveCompareBase() : null;
  let comparison = null, cmpSummary = "";
  if (currentReport && cmp) {
    comparison = compareMetrics(currentReport.metrics || {}, cmp.report.metrics || {});
    cmpSummary = buildLocalSummary(comparison, { clientName: client.name, periodLabel: monthKeyLabel(currentReport.period_month), baseLabel: cmp.label });
  }
  const th = 'style="text-align:left;padding:6px 8px;border-bottom:1px solid rgba(7,10,15,.08);"';
  const td = 'style="padding:6px 8px;border-bottom:1px solid rgba(7,10,15,.08);"';
  const fmtChange = (c) => c === null ? "—" : `<span style="color:${c >= 0 ? "#15803d" : "#b91c1c"};font-weight:700;">${c >= 0 ? "▲" : "▼"} ${Math.abs(c)}%</span>`;

  app.innerHTML = `
  <div class="no-print" style="background:var(--negro);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:20;">
    <a href="#/clientes/${client.id}" style="color:rgba(255,255,255,.7);text-decoration:none;font-size:14px;">← Volver a la ficha</a>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <span style="font-size:13px;color:rgba(255,255,255,.7);">Período</span>
      <select id="reportMonthSelect" onchange="window.__reportData.selectedMonth=this.value; renderReporte();" style="border-radius:8px;padding:6px 10px;">${monthOptions}</select>
      <span style="font-size:13px;color:rgba(255,255,255,.7);">Comparar con</span>
      <select onchange="window.__reportData.compareMode=this.value; window.__reportData.compareMonth=''; renderReporte();" style="border-radius:8px;padding:6px 10px;">${modeOpts}</select>
      ${customSelect}
      <button class="btn btn-primary btn-sm" onclick="downloadReportHtml()">Descargar HTML</button>
      <button class="btn btn-primary btn-sm" onclick="window.print()">Descargar PDF</button>
    </div>
  </div>
  <div id="reportPrintArea">
    <div style="max-width:800px;margin:0 auto;padding:40px 32px;font-family:'Inter',sans-serif;color:var(--negro);background:#fff;">
      <div class="report-header">
        <img src="${LOGO_DARK}" alt="Muta" style="height:32px;">
        <span class="report-tag">De la idea, al impacto.</span>
      </div>
      <p style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--arena);margin:0;">Informe de gestión</p>
      <h2 style="font-size:28px;font-weight:800;margin:4px 0 0;">${escapeHtml(client.name)}</h2>
      <p style="color:rgba(7,10,15,.6);margin:2px 0 22px;">${currentReport ? monthKeyLabel(currentReport.period_month) : "Resumen general"}${cmp ? ` · comparado con ${escapeHtml(cmp.label)}` : ""}</p>
      <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px;">
        <div style="flex:1;min-width:160px;background:#F5F6F8;border-radius:14px;padding:14px 16px;">
          <span style="display:block;font-size:12px;color:rgba(7,10,15,.5);">Total invertido con Muta</span>
          <strong style="font-size:18px;">${formatCurrency(total)}</strong>
        </div>
        <div style="flex:1;min-width:160px;background:#F5F6F8;border-radius:14px;padding:14px 16px;">
          <span style="display:block;font-size:12px;color:rgba(7,10,15,.5);">Trabajando juntos desde</span>
          <strong style="font-size:18px;">${parseLocalDate(client.start_date).toLocaleDateString("es-AR", { month: "long", year: "numeric" })}</strong>
        </div>
        <div style="flex:1;min-width:160px;background:#F5F6F8;border-radius:14px;padding:14px 16px;">
          <span style="display:block;font-size:12px;color:rgba(7,10,15,.5);">Pagos registrados</span>
          <strong style="font-size:18px;">${payments.length}</strong>
        </div>
      </div>
      ${currentReport ? `
      <div style="margin-bottom:22px;">
        <h3 style="font-size:16px;font-weight:800;margin-bottom:8px;">Resumen del período</h3>
        <p style="font-size:14px;">${escapeHtml(cmp ? cmpSummary : (currentReport.summary || ""))}</p>
        ${!cmp ? `<p class="no-print" style="font-size:13px;color:#b45309;">No hay un informe para comparar con la opción elegida. Probá con otra opción en “Comparar con”.</p>` : ""}
        ${cmp ? `
        <table style="width:100%;border-collapse:collapse;font-size:13px;">
          <thead><tr><th ${th}>Indicador</th><th ${th}>${escapeHtml(cmp.report.kind === "previo" ? "Antes de iniciar" : monthKeyLabel(cmp.report.period_month))}</th><th ${th}>${monthKeyLabel(currentReport.period_month)}</th><th ${th}>Variación</th></tr></thead>
          <tbody>${comparison.filter((c) => c.current !== null).slice(0, 25).map((c) => `<tr><td ${td}>${escapeHtml(c.label)}</td><td ${td}>${c.previous ?? "—"}</td><td ${td}>${c.current}</td><td ${td}>${fmtChange(c.changePct)}</td></tr>`).join("")}</tbody>
        </table>` : (Object.keys(currentReport.metrics || {}).length ? `
        <table style="width:100%;border-collapse:collapse;font-size:13px;">
          <thead><tr><th ${th}>Indicador</th><th ${th}>Total</th></tr></thead>
          <tbody>${Object.values(currentReport.metrics).map((m) => `<tr><td ${td}>${escapeHtml(m.label)}</td><td ${td}>${m.total}</td></tr>`).join("")}</tbody>
        </table>` : "")}
      </div>` : `<p style="font-size:14px;color:rgba(7,10,15,.6);margin-bottom:22px;">Todavía no hay informes mensuales cargados para este cliente.</p>`}
      <div style="margin-bottom:22px;">
        <h3 style="font-size:16px;font-weight:800;margin-bottom:8px;">Evolución de la inversión mensual</h3>
        <table style="width:100%;border-collapse:collapse;font-size:13px;">
          <thead><tr><th ${th}>Mes</th><th ${th}>Monto</th></tr></thead>
          <tbody>${months.map((m) => `<tr><td ${td}>${monthKeyLabel(m)}</td><td ${td}>${formatCurrency(byMonth[m] || 0)}</td></tr>`).join("")}</tbody>
        </table>
      </div>
      <div style="border-top:1px solid rgba(7,10,15,.1);padding-top:12px;font-size:12px;color:rgba(7,10,15,.5);">
        <p>Informe generado por el control interno de Muta Studio.</p>
      </div>
    </div>
  </div>`;
}
function downloadReportHtml() {
  const { client, selectedMonth } = window.__reportData;
  const inner = document.getElementById("reportPrintArea").innerHTML;
  const doc = `<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Informe ${escapeHtml(client.name)}</title></head><body>${inner}</body></html>`;
  const blob = new Blob([doc], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `informe-${client.name.toLowerCase().replace(/\s+/g, "-")}-${selectedMonth || "general"}.html`;
  a.click();
  URL.revokeObjectURL(url);
}

// -------------------- 15. INICIO --------------------
(async function init() {
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((_event, s) => { session = s; });
  // Si recarga la página estando adentro, vuelve siempre al panel general
  if (session && location.hash !== "#/login" && location.hash !== "" && location.hash !== "#/") {
    history.replaceState(null, "", "#/");
  }
  render();
})();
</script>
